<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>素材首页 · 红色文化数字基因库</title>
  <link rel="stylesheet" href="css/common.css">
</head>
<body>
  <!-- 顶部导航 -->
  <header class="top-bar">
    <div class="logo">★ 红色文化数字基因库</div>
    <nav class="nav">
      <a href="index.html" class="active">素材首页</a>
      <a href="javascript:;">排行榜</a>
      <a href="javascript:;">素材投稿</a>
      <a href="javascript:;">我的投稿</a>
      <a href="admin.html">管理员后台</a>
    </nav>
  </header>

  <main style="padding: 24px 32px;">
    <!-- 搜索与筛选（演示占位，后续按需实现真实筛选） -->
    <section style="display:flex;gap:12px;margin-bottom:20px;">
      <input type="text" placeholder="关键词检索：旧址、老照片、口述音频…"
             style="flex:1;padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:var(--font-body);">
      <button class="btn btn-red">搜索素材</button>
      <button class="btn btn-green">+ 提交素材投稿</button>
    </section>

    <h2 style="margin:20px 0 16px;">社区素材展示区</h2>
    <!-- 素材卡片墙：由 js/data.js 渲染 -->
    <section id="material-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;"></section>
  </main>

  <script src="js/data.js"></script>
  <script>
    // 渲染素材卡片；点击跳转详情页 detail.html?id=编号
    const grid = document.getElementById('material-grid');
    materials.forEach(m => {
      const card = document.createElement('div');
      card.className = 'card material-card';
      card.onclick = () => location.href = `detail.html?id=${m.id}`;
      const tags = m.tags.map(t => `<span class="tag">${t}</span>`).join('');
      card.innerHTML = `
        <img class="cover" src="${m.cover}" alt="${m.title}">
        <div class="info">
          <div class="title">${m.title}</div>
          <div class="tags">${tags}</div>
          <div class="meta"><span>浏览 ${m.views}</span><span>下载 ${m.downloads}</span></div>
        </div>`;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
